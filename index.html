<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111111">

<title>旅ログ v2.1 ポップ版</title>

<style>

:root{

  --bg:#f4f4f4;

  --card:#ffffff;

  --text:#1f1f1f;

  --sub:#777;

  --line:#e5e5e5;

}

*{box-sizing:border-box}

body{

  margin:0;

  font-family:

    "Hiragino Maru Gothic ProN",

    "Hiragino Maru Gothic Pro",

    "Yu Gothic",

    "Meiryo",

    sans-serif;

  background:var(--bg);

  color:var(--text);

}

header{

  background:#111;

  color:#fff;

  padding:18px 16px 14px;

  position:sticky;

  top:0;

  z-index:10;

}

header h1{

  margin:0;

  font-size:24px;

  font-weight:800;

  letter-spacing:.04em;

}

header .sub{

  font-size:12px;

  opacity:.8;

  margin-top:3px;

}

main{

  max-width:820px;

  margin:0 auto;

  padding:14px 14px 90px;

}

.card{

  background:var(--card);

  border-radius:18px;

  padding:16px;

  margin:0 0 14px;

  box-shadow:0 1px 5px rgba(0,0,0,.08);

}

h2{

  font-size:19px;

  margin:0 0 12px;

  font-weight:800;

  letter-spacing:.02em;

}

label{

  font-size:13px;

  color:var(--sub);

  display:block;

  margin:8px 0 5px;

}

input,textarea,select{

  width:100%;

  font:inherit;

  padding:11px 12px;

  border:1px solid #ccc;

  border-radius:14px;

  background:#fff;

}

textarea{

  min-height:92px;

  resize:vertical;

}

button{

  font:inherit;

  font-weight:700;

  border:0;

  border-radius:14px;

  padding:11px 14px;

  background:#111;

  color:#fff;

}

button.secondary{

  background:#e9e9e9;

  color:#111;

}

.row{

  display:flex;

  gap:8px;

  align-items:center;

}

.row>*{flex:1}

.actions{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:10px;

}

.item{

  border-top:1px solid var(--line);

  padding:10px 0;

}

.item:first-child{border-top:0}

.small{

  font-size:12px;

  color:var(--sub);

}

.empty{

  font-size:13px;

  color:#999;

  padding:4px 0;

}

.hidden{

  display:none!important;

}

nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  background:#fff;

  border-top:1px solid #ddd;

  display:grid;

  grid-template-columns:repeat(5,1fr);

  z-index:20;

  padding-bottom:env(safe-area-inset-bottom);

}

nav button{

  border-radius:0;

  background:#fff;

  color:#666;

  padding:10px 2px 8px;

  font-size:12px;

}

nav button.active{

  color:#111;

  font-weight:800;

}

nav span{

  display:block;

  font-size:20px;

  line-height:1;

  margin-bottom:4px;

}

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  display:flex;

  align-items:flex-end;

  z-index:30;

}

.modalBox{

  background:#fff;

  width:100%;

  border-radius:22px 22px 0 0;

  padding:18px;

  max-height:85vh;

  overflow:auto;

}

</style>

</head>

<body>

<header>

  <h1>旅ログ v2.1</h1>

  <div class="sub">旅行記録・荷物・発見・思い出</div>

</header>

<main>

<section id="homeView">

  <div class="card">

    <h2>旅をはじめる</h2>

    <div class="actions">

      <button id="newTripBtn">新規旅行</button>

      <button id="historyBtn" class="secondary">

        旅行履歴

      </button>

    </div>

  </div>

  <div class="card">

    <h2>現在の旅行</h2>

    <div id="currentTrip"></div>

  </div>

</section>

<section id="tripView" class="hidden">

  <div class="card">

    <h2>旅行</h2>

    <label>旅行名</label>

    <input

      id="tripName"

      placeholder="例：河口湖グランピング"

    >

    <div class="row">

      <div>

        <label>開始日</label>

        <input id="startDate" type="date">

      </div>

      <div>

        <label>終了日</label>

        <input id="endDate" type="date">

      </div>

    </div>

    <label>メモ</label>

    <textarea

      id="tripMemo"

      placeholder="宿泊先、予定など"

    ></textarea>

    <div class="actions">

      <button id="saveTripBtn">保存</button>

    </div>

  </div>

</section>

<section id="packView" class="hidden">

  <div class="card">

    <h2>荷物</h2>

    <div class="row">

      <input

        id="packInput"

        placeholder="持ち物を入力"

      >

      <button id="addPackBtn">

        追加

      </button>

    </div>

    <div id="packList"></div>

  </div>

</section>

<section id="discoverView" class="hidden">

  <div class="card">

    <h2>発見</h2>

    <textarea

      id="discoverInput"

      placeholder="旅先で見つけたこと、気づいたこと"

    ></textarea>

    <div class="actions">

      <button id="addDiscoverBtn">

        保存

      </button>

    </div>

    <div id="discoverList"></div>

  </div>

</section>

<section id="memoryView" class="hidden">

  <div class="card">

    <h2>思い出</h2>

    <textarea

      id="memoryInput"

      placeholder="印象に残ったこと、感想"

    ></textarea>

    <div class="actions">

      <button id="addMemoryBtn">

        保存

      </button>

    </div>

    <div id="memoryList"></div>

  </div>

</section>

</main>

<nav>

<button data-view="homeView" class="active">

  <span>⌂</span>

  ホーム

</button>

<button data-view="tripView">

  <span>✈</span>

  旅行

</button>

<button data-view="packView">

  <span>▣</span>

  荷物

</button>

<button data-view="discoverView">

  <span>✧</span>

  発見

</button>

<button data-view="memoryView">

  <span>★</span>

  思い出

</button>

</nav>

<div

  id="modal"

  class="modal hidden"

  aria-hidden="true"

>

<div class="modalBox">

<h2 id="modalTitle">

  新規旅行

</h2>

<label>旅行名</label>

<input

  id="modalTripName"

  placeholder="旅行名"

>

<div class="row">

<div>

<label>開始日</label>

<input id="modalStart" type="date">

</div>

<div>

<label>終了日</label>

<input id="modalEnd" type="date">

</div>

</div>

<div class="actions">

<button id="createTripBtn">

  作成

</button>

<button

  id="closeModalBtn"

  class="secondary"

>

  閉じる

</button>

</div>

<div

  id="historyList"

  class="hidden"

></div>

</div>

</div>

<script>

(function(){

'use strict';

const STORAGE_KEY = 'tabi-log-v21';

const defaults = {

  trips: [],

  activeTripId: null,

  pack: [],

  discoveries: [],

  memories: []

};

function load(){

  try{

    const raw =

      localStorage.getItem(STORAGE_KEY);

    if(!raw){

      return JSON.parse(

        JSON.stringify(defaults)

      );

    }

    const parsed = JSON.parse(raw);

    return {

      trips:

        Array.isArray(parsed.trips)

          ? parsed.trips : [],

      activeTripId:

        parsed.activeTripId || null,

      pack:

        Array.isArray(parsed.pack)

          ? parsed.pack : [],

      discoveries:

        Array.isArray(parsed.discoveries)

          ? parsed.discoveries : [],

      memories:

        Array.isArray(parsed.memories)

          ? parsed.memories : []

    };

  }catch(e){

    return JSON.parse(

      JSON.stringify(defaults)

    );

  }

}

let db = load();

function save(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(db)

  );

  render();

}
function esc(s){

  return String(s ?? '').replace(

    /[&<>"']/g,

    c => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#39;'

    }[c])

  );

}

function activeTrip(){

  return db.trips.find(

    t => t.id === db.activeTripId

  ) || null;

}

function showView(id){

  [

    'homeView',

    'tripView',

    'packView',

    'discoverView',

    'memoryView'

  ].forEach(v => {

    document

      .getElementById(v)

      .classList

      .toggle('hidden', v !== id);

  });

  document

    .querySelectorAll('nav button')

    .forEach(b => {

      b.classList.toggle(

        'active',

        b.dataset.view === id

      );

    });

  render();

}

function render(){

  const trip = activeTrip();

  const current =

    document.getElementById('currentTrip');

  current.innerHTML = trip

    ? `<strong>${esc(

        trip.name || '名称未設定'

      )}</strong>

      <div class="small">

        ${esc(trip.start || '')}

        ${trip.end

          ? ' ～ ' + esc(trip.end)

          : ''}

      </div>

      <div class="small">

        ${esc(trip.memo || '')}

      </div>`

    : `<div class="empty">

        現在の旅行はありません。

      </div>`;

  document.getElementById(

    'tripName'

  ).value = trip?.name || '';

  document.getElementById(

    'startDate'

  ).value = trip?.start || '';

  document.getElementById(

    'endDate'

  ).value = trip?.end || '';

  document.getElementById(

    'tripMemo'

  ).value = trip?.memo || '';

  document.getElementById(

    'packList'

  ).innerHTML = db.pack.length

    ? db.pack.map(

        (x,i) => `

        <div class="item">

        <label>

        <input

          type="checkbox"

          data-pack-check="${i}"

          ${x.done ? 'checked' : ''}

        >

        ${esc(x.text)}

        </label>

        <button

          class="secondary"

          data-pack-del="${i}"

        >

        削除

        </button>

        </div>`

      ).join('')

    : `<div class="empty">

        荷物はまだありません。

      </div>`;

  document.getElementById(

    'discoverList'

  ).innerHTML =

    db.discoveries.length

    ? db.discoveries.map(

        (x,i) => `

        <div class="item">

        ${esc(x)}

        <button

          class="secondary"

          data-discover-del="${i}"

        >

        削除

        </button>

        </div>`

      ).join('')

    : `<div class="empty">

        発見はまだありません。

      </div>`;

  document.getElementById(

    'memoryList'

  ).innerHTML =

    db.memories.length

    ? db.memories.map(

        (x,i) => `

        <div class="item">

        ${esc(x)}

        <button

          class="secondary"

          data-memory-del="${i}"

        >

        削除

        </button>

        </div>`

      ).join('')

    : `<div class="empty">

        思い出はまだありません。

      </div>`;

  bindDynamic();

}

function bindDynamic(){

  document

    .querySelectorAll(

      '[data-pack-check]'

    )

    .forEach(el => {

      el.onchange = () => {

        const i =

          Number(el.dataset.packCheck);

        if(db.pack[i]){

          db.pack[i].done =

            el.checked;

          save();

        }

      };

    });

  document

    .querySelectorAll(

      '[data-pack-del]'

    )

    .forEach(el => {

      el.onclick = () => {

        db.pack.splice(

          Number(el.dataset.packDel),

          1

        );

        save();

      };

    });

  document

    .querySelectorAll(

      '[data-discover-del]'

    )

    .forEach(el => {

      el.onclick = () => {

        db.discoveries.splice(

          Number(

            el.dataset.discoverDel

          ),

          1

        );

        save();

      };

    });

  document

    .querySelectorAll(

      '[data-memory-del]'

    )

    .forEach(el => {

      el.onclick = () => {

        db.memories.splice(

          Number(

            el.dataset.memoryDel

          ),

          1

        );

        save();

      };

    });

}

function openNewTrip(){

  document.getElementById(

    'modalTitle'

  ).textContent = '新規旅行';

  document.getElementById(

    'historyList'

  ).classList.add('hidden');

  document.getElementById(

    'modalTripName'

  ).classList.remove('hidden');

  document.getElementById(

    'modalStart'

  ).parentElement.parentElement

   .classList.remove('hidden');

  document.getElementById(

    'createTripBtn'

  ).classList.remove('hidden');

  document.getElementById(

    'modalTripName'

  ).value = '';

  document.getElementById(

    'modalStart'

  ).value = '';

  document.getElementById(

    'modalEnd'

  ).value = '';

  document.getElementById(

    'modal'

  ).classList.remove('hidden');

}

function openHistory(){

  document.getElementById(

    'modalTitle'

  ).textContent = '旅行履歴';

  document.getElementById(

    'historyList'

  ).classList.remove('hidden');

  document.getElementById(

    'modalTripName'

  ).classList.add('hidden');

  document.getElementById(

    'modalStart'

  ).parentElement.parentElement

   .classList.add('hidden');

  document.getElementById(

    'createTripBtn'

  ).classList.add('hidden');

  document.getElementById(

    'historyList'

  ).innerHTML = db.trips.length

    ? db.trips.map(

        t => `

        <div class="item">

        <button

          class="secondary"

          data-trip-open="${esc(t.id)}"

        >

          ${esc(

            t.name || '名称未設定'

          )}

        </button>

        <div class="small">

          ${esc(t.start || '')}

          ${t.end

            ? ' ～ ' + esc(t.end)

            : ''}

        </div>

        </div>`

      ).join('')

    : `<div class="empty">

        旅行履歴はありません。

      </div>`;

  document.getElementById(

    'modal'

  ).classList.remove('hidden');

  document

    .querySelectorAll(

      '[data-trip-open]'

    )

    .forEach(b => {

      b.onclick = () => {

        db.activeTripId =

          b.dataset.tripOpen;

        save();

        closeModal();

        showView('tripView');

      };

    });

}

function closeModal(){

  document.getElementById(

    'modal'

  ).classList.add('hidden');

}

document.getElementById(

  'newTripBtn'

).onclick = openNewTrip;

document.getElementById(

  'historyBtn'

).onclick = openHistory;

document.getElementById(

  'closeModalBtn'

).onclick = closeModal;

document.getElementById(

  'createTripBtn'

).onclick = () => {

  const id = String(Date.now());

  const trip = {

    id,

    name:

      document.getElementById(

        'modalTripName'

      ).value.trim()

      || '新しい旅行',

    start:

      document.getElementById(

        'modalStart'

      ).value,

    end:

      document.getElementById(

        'modalEnd'

      ).value,

    memo:''

  };

  db.trips.unshift(trip);

  db.activeTripId = id;

  save();

  closeModal();

  showView('tripView');

};

document.getElementById(

  'saveTripBtn'

).onclick = () => {

  let trip = activeTrip();

  if(!trip){

    const id =

      String(Date.now());

    trip = {

      id,

      name:'新しい旅行',

      start:'',

      end:'',

      memo:''

    };

    db.trips.unshift(trip);

    db.activeTripId = id;

  }

  trip.name =

    document.getElementById(

      'tripName'

    ).value.trim()

    || '名称未設定';

  trip.start =

    document.getElementById(

      'startDate'

    ).value;

  trip.end =

    document.getElementById(

      'endDate'

    ).value;

  trip.memo =

    document.getElementById(

      'tripMemo'

    ).value.trim();

  save();

};

document.getElementById(

  'addPackBtn'

).onclick = () => {

  const el =

    document.getElementById(

      'packInput'

    );

  const text =

    el.value.trim();

  if(!text) return;

  db.pack.push({

    text,

    done:false

  });

  el.value = '';

  save();

};

document.getElementById(

  'addDiscoverBtn'

).onclick = () => {

  const el =

    document.getElementById(

      'discoverInput'

    );

  const text =

    el.value.trim();

  if(!text) return;

  db.discoveries.unshift(text);

  el.value = '';

  save();

};

document.getElementById(

  'addMemoryBtn'

).onclick = () => {

  const el =

    document.getElementById(

      'memoryInput'

    );

  const text =

    el.value.trim();

  if(!text) return;

  db.memories.unshift(text);

  el.value = '';

  save();

};

document

  .querySelectorAll('nav button')

  .forEach(b => {

    b.onclick = () =>

      showView(b.dataset.view);

  });

render();

})();

</script>

</body>

</html>
